<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Valija Mágica</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<style>
  :root{
    --bg:#faf8f5;
    --ink:#1f1c1a;
    --muted:#6b6459;
    --accent:#b5502f;
    --card:#ffffff;
    --border:#e8e2d9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);
    color:var(--ink);
  }
  header{
    background:#1f1c1a;
    color:#fff;
    padding:36px 20px 30px;
    text-align:center;
  }
  header h1{
    margin:0 0 6px;
    font-size:28px;
    letter-spacing:.3px;
  }
  header p{
    margin:0;
    color:#cfc8bd;
    font-size:14px;
  }
  .status-bar{
    max-width:1100px;
    margin:0 auto;
    padding:10px 20px;
    font-size:12px;
    color:var(--muted);
    text-align:center;
  }
  .filters{
    max-width:1100px;
    margin:0 auto;
    padding:0 20px 10px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    justify-content:center;
  }
  .filters button{
    border:1px solid var(--border);
    background:#fff;
    color:var(--ink);
    padding:7px 14px;
    border-radius:20px;
    font-size:13px;
    cursor:pointer;
  }
  .filters button.active{
    background:var(--accent);
    border-color:var(--accent);
    color:#fff;
  }
  main{
    max-width:1100px;
    margin:0 auto;
    padding:10px 20px 60px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(230px,1fr));
    gap:20px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--border);
    border-radius:12px;
    overflow:hidden;
    display:flex;
    flex-direction:column;
    position:relative;
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .card:hover{
    transform:translateY(-3px);
    box-shadow:0 8px 20px rgba(0,0,0,.08);
  }
  .photo-wrap{
    position:relative;
    background:#f1ede7;
    aspect-ratio:4/5;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
  }
  .photo-wrap img{
    width:100%;
    height:100%;
    object-fit:contain;
  }
  .badge{
    position:absolute;
    top:10px;
    left:10px;
    background:var(--accent);
    color:#fff;
    font-size:11px;
    padding:4px 9px;
    border-radius:20px;
    text-transform:uppercase;
    letter-spacing:.4px;
  }
  .sold-overlay{
    position:absolute;
    inset:0;
    background:rgba(255,255,255,.55);
    display:flex;
    align-items:center;
    justify-content:center;
  }
  .sold-overlay span{
    background:#1f1c1a;
    color:#fff;
    font-size:13px;
    font-weight:600;
    letter-spacing:1px;
    padding:6px 16px;
    border-radius:4px;
    transform:rotate(-8deg);
  }
  .info{
    padding:14px 14px 16px;
    display:flex;
    flex-direction:column;
    gap:4px;
    flex:1;
  }
  .info h3{
    margin:0;
    font-size:15px;
    font-weight:600;
  }
  .info .meta{
    font-size:12px;
    color:var(--muted);
  }
  .info .desc{
    font-size:12px;
    color:var(--muted);
    margin-top:4px;
    line-height:1.4;
    flex:1;
  }
  .price-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-top:10px;
  }
  .price{
    font-size:19px;
    font-weight:700;
    color:var(--accent);
  }
  .price.sold{
    color:var(--muted);
    text-decoration:line-through;
    font-size:15px;
  }
  .whatsapp-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width:34px;
  height:34px;
  border-radius:50%;
  background:#25D366;
  flex-shrink:0;
  text-decoration:none;
  transition:transform .15s ease;
}
.whatsapp-btn:hover{
  transform:scale(1.08);
}
  .card.is-sold .photo-wrap img{
    filter:grayscale(.3);
  }
  .empty, .error{
    text-align:center;
    color:var(--muted);
    padding:60px 20px;
  }
  footer{
    text-align:center;
    padding:20px;
    font-size:12px;
    color:var(--muted);
  }
</style>
</head>
<body>

<header>
  <h1>La Valija Mágica - Catálogo de Ropa</h1>
  <p>Prendas y Calzados en excelente estado · Contactame por Whatsapp</p>
</header>

<div class="filters" id="filters"></div>
<div class="status-bar" id="statusBar"></div>

<main>
  <div class="grid" id="grid"></div>
</main>

<footer>
  Consultas y coordinación de entrega por el medio de contacto habitual.
</footer>

<script>
/* ============================================================
   CONFIGURACIÓN
   Pegar acá la URL del CSV publicado del Google Sheet.
   Archivo > Compartir > Publicar en la web > elegir la hoja >
   formato "Valores separados por comas (.csv)" > Publicar.
   Ejemplo de URL resultante:
   https://docs.google.com/spreadsheets/d/e/XXXXX/pub?output=csv
   ============================================================ */
const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vS88wNsTeAFzS9L58OumSnIWz8tiviUj_kixZ3W_mJNN3nZVPtHxv__tnwshjVEf4OA9m673_yf-jg1/pub?output=csv"; // <-- reemplazar por la URL publicada

  // Número de WhatsApp en formato internacional: 54 9 + código de área + número (sin el 15)
const WHATSAPP_NUMBER = "5491141568137";

const WHATSAPP_ICON = `<svg viewBox="0 0 32 32" width="18" height="18" fill="#fff"><path d="M16.004 3C9.383 3 4 8.373 4 14.982c0 2.37.7 4.58 1.902 6.43L4 29l7.77-1.874a13.03 13.03 0 0 0 4.234.706C22.626 27.832 28 22.46 28 15.85 28 9.24 22.626 3 16.004 3zm7.53 18.53c-.317.892-1.57 1.633-2.57 1.845-.686.144-1.582.26-4.6-.986-3.864-1.6-6.354-5.522-6.548-5.78-.192-.257-1.573-2.093-1.573-3.994 0-1.9.997-2.833 1.35-3.222.353-.39.77-.487 1.027-.487.257 0 .514.003.738.014.237.012.554-.09.867.66.32.77 1.09 2.66 1.187 2.854.096.192.16.418.032.674-.128.257-.192.418-.385.643-.192.225-.406.502-.58.674-.192.192-.393.4-.17.786.225.386.997 1.645 2.14 2.664 1.472 1.312 2.713 1.72 3.1 1.912.386.192.611.16.836-.096.225-.257.964-1.123 1.222-1.51.257-.386.514-.322.867-.193.353.13 2.24 1.058 2.624 1.25.385.193.642.29.738.45.096.16.096.93-.222 1.822z"/></svg>`;

function buildWhatsAppLink(item){
  const msg = `Hola! Me interesa "${item.nombre}" (${formatPrice(item.precio)}) de La Valija Mágica.`;
  return `https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`;
}
// Datos de ejemplo (se usan si SHEET_CSV_URL está vacío o falla la carga)
const DEMO_DATA = [
  {id:"1", nombre:"Jogger Infantil Estampado", categoria:"Infantil", talle:"8 años", precio:"4500", estado:"disponible", descripcion:"Jogger de algodón rosa con estampa. Muy buen estado.", foto:"item1.jpg"},
  {id:"2", nombre:"Jogger Deportivo Camuflado", categoria:"Deportivo", talle:"10 años", precio:"6000", estado:"disponible", descripcion:"Jogger deportivo estampado camuflado con detalles laterales. Uso moderado.", foto:"item2.jpg"},
  {id:"3", nombre:"Pantalón Cargo Wide Leg", categoria:"Cargo", talle:"S", precio:"7000", estado:"vendido", descripcion:"Pantalón cargo gris con bolsillos laterales y tiro amplio.", foto:"item3.jpg"},
  {id:"4", nombre:"Jogger Deportivo", categoria:"Deportivo", talle:"12 años", precio:"5500", estado:"disponible", descripcion:"Jogger verde con detalles laterales. Excelente estado.", foto:"item4.jpg"},
  {id:"5", nombre:"Lote Remeras Deportivas (x2)", categoria:"Deportivo", talle:"10 años", precio:"3500", estado:"disponible", descripcion:"Dos remeras/buzos deportivos de manga corta y larga. Se venden juntas.", foto:"item5.jpg"},
  {id:"6", nombre:"Pantalón Wide Leg Rayado", categoria:"Wide Leg", talle:"M", precio:"6500", estado:"disponible", descripcion:"Pantalón a rayas blanco y negro, tiro alto, calce amplio.", foto:"item6.jpg"}
];

let ALL_ITEMS = [];
let activeCategory = "Todos";

function formatPrice(p){
  const n = parseFloat(p);
  if(isNaN(n)) return p;
  return "$" + n.toLocaleString("es-AR");
}

function normalizeRow(row){
  return {
    id: row.id || "",
    nombre: row.nombre || "Sin nombre",
    categoria: row.categoria || "Otros",
    talle: row.talle || "-",
    precio: row.precio || "",
    estado: (row.estado || "disponible").trim().toLowerCase(),
    descripcion: row.descripcion || "",
    foto: row.foto || ""
  };
}

function render(){
  const grid = document.getElementById("grid");
  const items = activeCategory === "Todos"
    ? ALL_ITEMS
    : ALL_ITEMS.filter(i => i.categoria === activeCategory);

  if(items.length === 0){
    grid.innerHTML = '<div class="empty">No hay prendas en esta categoría por ahora.</div>';
    return;
  }

  grid.innerHTML = items.map(item => {
    const sold = item.estado === "vendido";
    return `
      <div class="card ${sold ? "is-sold" : ""}">
        <div class="photo-wrap">
          ${item.categoria ? `<span class="badge">${item.categoria}</span>` : ""}
          <img src="${item.foto}" alt="${item.nombre}" loading="lazy" onerror="this.style.opacity=0.15">
          ${sold ? '<div class="sold-overlay"><span>VENDIDO</span></div>' : ""}
        </div>
        <div class="info">
          <h3>${item.nombre}</h3>
          <div class="meta">Talle: ${item.talle}</div>
          <div class="desc">${item.descripcion}</div>
          <div class="price-row">
           <span class="price ${sold ? "sold" : ""}">${formatPrice(item.precio)}</span>
  ${sold ? "" : `<a class="whatsapp-btn" href="${buildWhatsAppLink(item)}" target="_blank" rel="noopener" aria-label="Consultar por WhatsApp">${WHATSAPP_ICON}</a>`}
          </div>
        </div>
      </div>
    `;
  }).join("");
}

function renderFilters(){
  const cats = ["Todos", ...new Set(ALL_ITEMS.map(i => i.categoria))];
  const filtersEl = document.getElementById("filters");
  filtersEl.innerHTML = cats.map(c =>
    `<button data-cat="${c}" class="${c === activeCategory ? "active" : ""}">${c}</button>`
  ).join("");
  filtersEl.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      activeCategory = btn.dataset.cat;
      renderFilters();
      render();
    });
  });
}

function setStatus(msg){
  document.getElementById("statusBar").textContent = msg;
}

function loadFromDemo(reason){
  ALL_ITEMS = DEMO_DATA.map(normalizeRow);
  renderFilters();
  render();
  setStatus(reason + " — mostrando catálogo de ejemplo.");
}

function init(){
  if(!SHEET_CSV_URL){
    loadFromDemo("No hay una hoja de Google Sheets conectada todavía");
    return;
  }
  setStatus("Cargando catálogo...");
  // Se agrega un parámetro único para evitar que el navegador
  // sirva una respuesta vieja cacheada del CSV publicado.
  const sep = SHEET_CSV_URL.includes("?") ? "&" : "?";
  const bustedUrl = SHEET_CSV_URL + sep + "_=" + Date.now();
  Papa.parse(bustedUrl, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results){
      if(!results.data || results.data.length === 0){
        loadFromDemo("La hoja está vacía o no se pudo leer");
        return;
      }
      ALL_ITEMS = results.data.map(normalizeRow);
      activeCategory = "Todos";
      renderFilters();
      render();
      setStatus("Catálogo actualizado desde Google Sheets · " + new Date().toLocaleString("es-AR"));
    },
    error: function(){
      loadFromDemo("No se pudo conectar con la hoja");
    }
  });
}

init();
</script>

</body>
</html>
